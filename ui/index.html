<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Browser Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left Panel - Browser View */
        .browser-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 0;
        }

        .browser-header {
            padding: 12px 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .browser-header h2 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .url-bar {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .url-bar input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
        }

        .url-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .url-bar button {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
        }

        .url-bar button:hover {
            opacity: 0.9;
        }

        .browser-viewport {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .browser-viewport img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .browser-viewport .placeholder {
            text-align: center;
            color: var(--text-muted);
        }

        .browser-viewport .placeholder .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .browser-status {
            padding: 8px 16px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Right Panel - Reasoning */
        .reasoning-panel {
            width: 420px;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
        }

        .reasoning-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .reasoning-header h2 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-input {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .task-input textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            resize: none;
            height: 80px;
            font-family: inherit;
        }

        .task-input textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-input textarea::placeholder {
            color: var(--text-muted);
        }

        .task-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .task-buttons button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled, .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Reasoning Log */
        .reasoning-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .log-entry {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.action {
            border-left-color: var(--success);
        }

        .log-entry.error {
            border-left-color: var(--error);
        }

        .log-entry.status {
            border-left-color: var(--warning);
        }

        .log-entry .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-entry .type {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-panel);
        }

        .log-entry .time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .log-entry .thought {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .log-entry .details {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            background: var(--bg-panel);
            padding: 8px;
            border-radius: 4px;
        }

        .log-entry .result {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
        }

        .log-entry .result.success {
            color: var(--success);
        }

        .log-entry .result.failed {
            color: var(--error);
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.ready {
            background: var(--success);
        }

        .status-dot.running {
            background: var(--accent);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.error {
            background: var(--error);
        }

        /* Connection status */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        /* Empty state */
        .empty-log {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-log .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left: Browser View -->
        <div class="browser-panel">
            <div class="browser-header">
                <h2>🌐 Browser</h2>
                <div class="url-bar">
                    <input type="text" id="urlInput" placeholder="Enter URL and press Go...">
                    <button onclick="navigate()">Go</button>
                </div>
            </div>
            <div class="browser-viewport" id="viewport">
                <div class="placeholder" id="placeholder">
                    <div class="icon">🚀</div>
                    <p>Click "Start Agent" to begin</p>
                </div>
                <img id="screenshot" style="display: none;">
                <div class="loading-overlay" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <span id="loadingText">Starting browser...</span>
                </div>
            </div>
            <div class="browser-status">
                <span id="pageInfo">No page loaded</span>
                <span id="scrollInfo">Scroll: 0%</span>
            </div>
        </div>

        <!-- Right: Reasoning Panel -->
        <div class="reasoning-panel">
            <div class="reasoning-header">
                <h2>
                    🧠 Agent Reasoning
                    <div class="connection-status">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                </h2>
            </div>

            <div class="task-input">
                <textarea id="taskInput" placeholder="Describe what you want the agent to do...&#10;&#10;Examples:&#10;• Search for Python tutorials&#10;• Fill out the contact form with my info&#10;• Click on the login button"></textarea>
                <div class="task-buttons">
                    <button class="btn-primary" id="runBtn" onclick="runTask()" disabled>
                        ▶ Run Task
                    </button>
                    <button class="btn-danger" id="stopBtn" onclick="stopTask()" style="display: none;">
                        ⏹ Stop
                    </button>
                    <button class="btn-secondary" id="initBtn" onclick="initAgent()">
                        🚀 Start Agent
                    </button>
                </div>
            </div>

            <div class="reasoning-log" id="log">
                <div class="empty-log">
                    <div class="icon">💭</div>
                    <p>Agent thoughts and actions will appear here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isReady = false;
        let isRunning = false;

        // Connect WebSocket
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                setStatus('connected', 'Connected');
            };

            ws.onclose = () => {
                setStatus('error', 'Disconnected');
                setTimeout(connect, 2000);
            };

            ws.onerror = () => {
                setStatus('error', 'Connection error');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'connected':
                    if (msg.ready) {
                        setReady(true);
                    }
                    break;

                case 'status':
                    addLogEntry('status', msg.message);
                    document.getElementById('loadingText').textContent = msg.message;
                    if (msg.ready) {
                        setReady(true);
                        hideLoading();
                    }
                    break;

                case 'error':
                    addLogEntry('error', msg.message);
                    hideLoading();
                    break;

                case 'screenshot':
                    showScreenshot(msg.data);
                    break;

                case 'thinking':
                    addLogEntry('thinking', msg.thought);
                    break;

                case 'action':
                    addLogEntry('action', msg.thought, {
                        action: msg.action,
                        target: msg.target,
                        value: msg.value,
                        success: msg.success,
                        message: msg.message,
                    });
                    break;

                case 'state':
                    document.getElementById('pageInfo').textContent =
                        `${msg.title || 'Untitled'} • ${msg.elements} elements`;
                    document.getElementById('scrollInfo').textContent =
                        `Scroll: ${Math.round(msg.scroll)}%`;
                    break;

                case 'task_start':
                    setRunning(true);
                    addLogEntry('status', `Starting task: "${msg.task}"`);
                    break;

                case 'task_complete':
                    setRunning(false);
                    const resultType = msg.success ? 'status' : 'error';
                    addLogEntry(resultType,
                        `Task ${msg.success ? 'completed' : 'failed'}: ${msg.message} ` +
                        `(${msg.actions} actions, ${msg.duration.toFixed(1)}s)`
                    );
                    break;
            }
        }

        function setStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            dot.className = 'status-dot ' + state;
            statusText.textContent = text;
        }

        function setReady(ready) {
            isReady = ready;
            document.getElementById('runBtn').disabled = !ready;
            document.getElementById('initBtn').style.display = ready ? 'none' : 'block';

            if (ready) {
                setStatus('ready', 'Ready');
            }
        }

        function setRunning(running) {
            isRunning = running;
            document.getElementById('runBtn').style.display = running ? 'none' : 'block';
            document.getElementById('stopBtn').style.display = running ? 'block' : 'none';
            document.getElementById('taskInput').disabled = running;

            if (running) {
                setStatus('running', 'Running...');
            } else {
                setStatus('ready', 'Ready');
            }
        }

        function showLoading(text) {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loadingText').textContent = text;
            document.getElementById('placeholder').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showScreenshot(base64) {
            const img = document.getElementById('screenshot');
            img.src = 'data:image/png;base64,' + base64;
            img.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
        }

        function addLogEntry(type, thought, details = null) {
            const log = document.getElementById('log');

            // Remove empty state if present
            const empty = log.querySelector('.empty-log');
            if (empty) empty.remove();

            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;

            const time = new Date().toLocaleTimeString();

            let html = `
                <div class="header">
                    <span class="type">${type}</span>
                    <span class="time">${time}</span>
                </div>
                <div class="thought">${escapeHtml(thought)}</div>
            `;

            if (details) {
                let detailsHtml = '';
                if (details.action) detailsHtml += `Action: ${details.action}\n`;
                if (details.target) detailsHtml += `Target: ${details.target}\n`;
                if (details.value) detailsHtml += `Value: ${details.value}\n`;

                if (detailsHtml) {
                    html += `<div class="details">${escapeHtml(detailsHtml.trim())}</div>`;
                }

                if (details.success !== undefined) {
                    html += `
                        <div class="result ${details.success ? 'success' : 'failed'}">
                            ${details.success ? '✓ Success' : '✗ ' + details.message}
                        </div>
                    `;
                }
            }

            entry.innerHTML = html;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Actions
        function initAgent() {
            showLoading('Starting browser...');
            ws.send(JSON.stringify({ type: 'init' }));
        }

        function runTask() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) {
                alert('Please enter a task');
                return;
            }

            const url = document.getElementById('urlInput').value.trim();

            ws.send(JSON.stringify({
                type: 'task',
                task: task,
                url: url || null,
            }));
        }

        function stopTask() {
            ws.send(JSON.stringify({ type: 'stop' }));
        }

        function navigate() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            // Add https if missing
            let fullUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                fullUrl = 'https://' + url;
            }

            document.getElementById('urlInput').value = fullUrl;
            ws.send(JSON.stringify({ type: 'navigate', url: fullUrl }));
        }

        // Keyboard shortcuts
        document.getElementById('taskInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                runTask();
            }
        });

        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        // Start connection
        connect();
    </script>
</body>
</html>
